name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Debian 13 has the versions the tests were written with (gcc 14, clang and clang-tidy 19). The messages of the
    # tools change between versions, and the features assert codes that depend on the analyzers.
    container: debian:trixie
    steps:
      - name: Install the tools
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends ca-certificates curl git make gcc libc6-dev clang clang-tidy

      # The tools are the product: a missing one is a failure here, never a skipped test.
      - name: Check that the tools are there
        run: |
          for tool in gcc clang clang-tidy; do
            command -v "$tool" || { echo "$tool is missing"; exit 1; }
            "$tool" --version | head -n 1
          done

      - uses: actions/checkout@v4

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: 0.27.0
          sha256: 87319417a3ad3338af8117e0885cbabf63ae54c8e4539318829c221a342342f9 # linux-x86_64

      - name: Check
        run: |
          agentica --version
          make check

      - name: Format
        run: make fmt-check

      # native/cchecker_scan_native.h is made from the extern module block of src/scan.agc by native-gen.
      - name: Native header
        run: make header-check

      # The features of specs/ run cchecker on the C fixtures; test/ has the unit tests of the parsers.
      - name: Test
        run: make test

  # The scenarios tagged @slow: large generated inputs, each under a bound on memory and time (specs/limits.feature).
  # They run on every PR, apart from the default tests, so that `make test` stays quick.
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: debian:trixie
    steps:
      - name: Install the tools
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends ca-certificates curl git make gcc libc6-dev clang clang-tidy

      - name: Check that the tools are there
        run: |
          for tool in gcc clang clang-tidy; do
            command -v "$tool" || { echo "$tool is missing"; exit 1; }
            "$tool" --version | head -n 1
          done

      - uses: actions/checkout@v4

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: 0.27.0
          sha256: 87319417a3ad3338af8117e0885cbabf63ae54c8e4539318829c221a342342f9 # linux-x86_64

      - name: Slow tests
        run: make test-slow
