name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AGENTICA_VERSION: 0.26.1
  AGENTICA_SHA256: 68c3e825cb14148e45c47b21b6ef66036c5ad17a2cdf36948f47e1415bae5524

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Debian 13 has the versions the tests were written with (gcc 14, clang and clang-tidy 19). The messages of the
    # tools change between versions, and the features assert codes that depend on the analyzers.
    container: debian:trixie
    steps:
      - name: Install the tools
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends ca-certificates curl jq git make gcc libc6-dev clang clang-tidy

      # The tools are the product: a missing one is a failure here, never a skipped test.
      - name: Check that the tools are there
        run: |
          for tool in gcc clang clang-tidy; do
            command -v "$tool" || { echo "$tool is missing"; exit 1; }
            "$tool" --version | head -n 1
          done

      - uses: actions/checkout@v4

      - name: Install the pinned Agentica release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          archive="agentica-${AGENTICA_VERSION}-linux-x86_64.tar.gz"
          repo="https://api.github.com/repos/agentica-lang/agentica"
          direct="https://github.com/agentica-lang/agentica/releases/download/${AGENTICA_VERSION}/$archive"
          # The release asset through the API, then the direct link: either can answer 5xx for a while
          # (the direct link gave 504 for an hour on 2026-11-08). 5 tries, waiting 10, 20, 40 and 80 s.
          fetch() {
            id=$(curl -fsSL --connect-timeout 20 --max-time 60 -H "Authorization: Bearer $GITHUB_TOKEN" \
              "$repo/releases/tags/${AGENTICA_VERSION}" |
              jq -r --arg name "$archive" '.assets[] | select(.name == $name) | .id') &&
              [ -n "$id" ] &&
              curl -fsSL --connect-timeout 20 --max-time 60 -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/octet-stream" -o "$RUNNER_TEMP/$archive" "$repo/releases/assets/$id" ||
              curl -fsSL --connect-timeout 20 --max-time 60 -o "$RUNNER_TEMP/$archive" "$direct"
          }
          delay=10
          for try in 1 2 3 4 5; do
            fetch && break
            if [ "$try" = 5 ]; then
              echo "download failed after $try tries"
              exit 1
            fi
            echo "download failed (try $try), retrying in ${delay}s"
            sleep "$delay"
            delay=$((delay * 2))
          done
          echo "${AGENTICA_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/agentica-${AGENTICA_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Check
        run: |
          agentica --version
          make check

      - name: Format
        run: make fmt-check

      # The features of specs/ run cchecker on the C fixtures; test/ has the unit tests of the parsers.
      - name: Test
        run: make test
